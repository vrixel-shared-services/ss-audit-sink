[project]
name = "audit-sink"
version = "0.1.0"
description = "Vrixel shared audit sink: copies a product's audit topic from Kafka into an append-only, hash-chained Postgres table and archives it to object storage."
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.16,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "boto3>=1.43,<2",
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "prometheus-client>=0.26,<1",
]

[project.scripts]
audit-sink = "audit_sink.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "moto[s3]>=5.2,<6",
    "boto3-stubs[s3]>=1.43",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_sink"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]

[tool.mypy]
strict = true
packages = ["audit_sink"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kafka: needs a Kafka broker at AUDIT_SINK_TEST_KAFKA (CI starts one)"]
addopts = "-q --cov=audit_sink --cov-report=term --cov-report=xml --junitxml=reports/junit.xml"

[tool.coverage.report]
fail_under = 90
